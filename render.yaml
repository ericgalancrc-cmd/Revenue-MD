services:
  - type: web
    name: revenuemd-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenuemd-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://revenue-md.vercel.app  # update to your real Vercel URL

databases:
  - name: revenuemd-db
    plan: free
    databaseName: revenuemd
