version: "3.9"

services:
  api:
    image: revenuemd-api:latest
    build: ./backend
    expose:
      - "8000"
    env_file:
      - /opt/revenuemd/.env    # server-side env file, not in repo
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro    # Let's Encrypt certs
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    restart: always
