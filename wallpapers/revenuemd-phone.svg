<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#050E20"/>
      <stop offset="40%"  stop-color="#0D1C46"/>
      <stop offset="100%" stop-color="#071230"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="43%" r="28%">
      <stop offset="0%"   stop-color="#16B6C9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#16B6C9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>

    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#16B6C9" flood-opacity="0.42"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#16B6C9" flood-opacity="0.50"/>
    </filter>
  </defs>

  <!-- ── Backgrounds ─────────────────────────────────────────────────── -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- ── Large faint stethoscope watermark (background) ────────────── -->
  <!-- Scaled to ~900×900, centered on canvas, very low opacity         -->
  <!-- Lucide paths scaled from 24×24 → 900×900 (scale=37.5)           -->
  <!-- translate to center: (1080-900)/2=90, (1920-900)/2=510          -->
  <g transform="translate(90, 510)" opacity="0.04" fill="none"
     stroke="#16B6C9" stroke-linecap="round" stroke-linejoin="round">
    <svg x="0" y="0" width="900" height="900" viewBox="0 0 24 24">
      <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"
        stroke="#16B6C9" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"
        stroke="#16B6C9" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="10" r="2" stroke="#16B6C9" stroke-width="1.2" fill="none"/>
    </svg>
  </g>

  <!-- ── Horizontal accent lines ────────────────────────────────────── -->
  <line x1="0" y1="490"  x2="1080" y2="490"  stroke="#16B6C9" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="1430" x2="1080" y2="1430" stroke="#16B6C9" stroke-width="1" opacity="0.05"/>

  <!-- ── Icon mark — 280×280, centered at x=540 ────────────────────── -->
  <circle cx="540" cy="740" r="185" fill="#16B6C9" fill-opacity="0.06"/>

  <g transform="translate(400, 600)" filter="url(#iconGlow)">
    <rect width="280" height="280" rx="70"
      fill="#0F224E" stroke="#16B6C9" stroke-width="2.5" stroke-opacity="0.55"/>
    <!-- Stethoscope from Lucide, scaled to 220×220 with 30px padding   -->
    <svg x="30" y="30" width="220" height="220" viewBox="0 0 24 24">
      <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"
        fill="none" stroke="#16B6C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"
        fill="none" stroke="#16B6C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="10" r="2"
        fill="none" stroke="#16B6C9" stroke-width="1.7"/>
    </svg>
  </g>

  <!-- ── Thin separator ──────────────────────────────────────────────── -->
  <line x1="410" y1="916" x2="670" y2="916" stroke="#16B6C9" stroke-width="1" stroke-opacity="0.25"/>

  <!-- ── Wordmark ────────────────────────────────────────────────────── -->
  <text x="540" y="1006"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="80" font-weight="400"
    fill="#ffffff" fill-opacity="0.90"
    text-anchor="middle" letter-spacing="3">Revenue</text>

  <text x="540" y="1120"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="128" font-weight="700"
    fill="#16B6C9" text-anchor="middle" letter-spacing="8"
    filter="url(#textGlow)">MD</text>

  <!-- ── Tagline ─────────────────────────────────────────────────────── -->
  <text x="540" y="1180"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="27" font-weight="300"
    fill="#ffffff" fill-opacity="0.35"
    text-anchor="middle" letter-spacing="10">REVENUE INTELLIGENCE</text>

  <!-- ── Dot divider ─────────────────────────────────────────────────── -->
  <circle cx="510" cy="1230" r="3.5" fill="#16B6C9" fill-opacity="0.25"/>
  <circle cx="540" cy="1230" r="3.5" fill="#16B6C9" fill-opacity="0.45"/>
  <circle cx="570" cy="1230" r="3.5" fill="#16B6C9" fill-opacity="0.25"/>

  <!-- ── Bottom fine print ───────────────────────────────────────────── -->
  <text x="540" y="1858"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="22" font-weight="300"
    fill="#ffffff" fill-opacity="0.14"
    text-anchor="middle" letter-spacing="3.5">Puerto Rico · Healthcare Billing Intelligence</text>
</svg>
