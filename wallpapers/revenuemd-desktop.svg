<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient — diagonal sweep -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050E20"/>
      <stop offset="50%"  stop-color="#0D1C46"/>
      <stop offset="100%" stop-color="#071230"/>
    </linearGradient>

    <!-- Teal radial glow behind the icon -->
    <radialGradient id="glow" cx="50%" cy="46%" r="22%">
      <stop offset="0%"   stop-color="#16B6C9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#16B6C9" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle dot grid texture -->
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>

    <!-- Glow filter on icon -->
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#16B6C9" flood-opacity="0.38"/>
    </filter>

    <!-- Glow on MD text -->
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#16B6C9" flood-opacity="0.48"/>
    </filter>
  </defs>

  <!-- ── Background ───────────────────────────────────────────────────── -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- ── Full-width ECG decoration ─────────────────────────────────── -->
  <!-- Background ECG — very faint, runs full 1920px width at y=900 -->
  <polyline
    points="
      -10,900  90,900  118,900  140,840  160,960  180,840  208,900
      330,900  358,900  380,840  400,960  420,840  448,900
      570,900  598,900  620,840  640,960  660,840  688,900
      810,900  838,900  860,840  880,960  900,840  928,900
      1050,900 1078,900 1100,840 1120,960 1140,840 1168,900
      1290,900 1318,900 1340,840 1360,960 1380,840 1408,900
      1530,900 1558,900 1580,840 1600,960 1620,840 1648,900
      1770,900 1798,900 1820,840 1840,960 1860,840 1888,900
      1930,900"
    stroke="#16B6C9" stroke-width="2.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.09"/>

  <!-- Accent horizontal lines -->
  <line x1="0" y1="140"  x2="1920" y2="140"  stroke="#16B6C9" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="940"  x2="1920" y2="940"  stroke="#16B6C9" stroke-width="1" opacity="0.05"/>

  <!-- Left vertical accent -->
  <line x1="200" y1="0" x2="200" y2="1080" stroke="#16B6C9" stroke-width="1" opacity="0.04"/>
  <!-- Right vertical accent -->
  <line x1="1720" y1="0" x2="1720" y2="1080" stroke="#16B6C9" stroke-width="1" opacity="0.04"/>

  <!-- ── Icon mark — centered 240×240 at screen center ─────────────── -->
  <!-- Background teal circle glow -->
  <circle cx="960" cy="430" r="160" fill="#16B6C9" fill-opacity="0.07"/>

  <!-- Icon (240×240) centered: starts at x=840, y=310 -->
  <!-- Scale: 240/56 = 4.286×  -->
  <!-- ECG pts: 6,28→26,120  18,28→77,120  22,38→94,163  28,10→120,43  32,38→137,163  38,28→163,120  50,28→214,120 -->
  <!-- rx: 14×4.286 = 60 -->
  <g transform="translate(840, 310)" filter="url(#iconGlow)">
    <rect width="240" height="240" rx="60"
      fill="#0F224E"
      stroke="#16B6C9" stroke-width="2" stroke-opacity="0.55"/>
    <polyline
      points="26,120 77,120 94,163 120,43 137,163 163,120 214,120"
      stroke="#16B6C9" stroke-width="17" fill="none"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── Thin separator line ─────────────────────────────────────────── -->
  <line x1="760" y1="582" x2="1160" y2="582" stroke="#16B6C9" stroke-width="1" stroke-opacity="0.22"/>

  <!-- ── Wordmark ────────────────────────────────────────────────────── -->
  <text x="960" y="652"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="60" font-weight="400"
    fill="#ffffff" fill-opacity="0.90"
    text-anchor="middle" letter-spacing="3">Revenue</text>

  <text x="960" y="746"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96" font-weight="700"
    fill="#16B6C9"
    text-anchor="middle" letter-spacing="8"
    filter="url(#textGlow)">MD</text>

  <!-- ── Tagline ─────────────────────────────────────────────────────── -->
  <text x="960" y="796"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="21" font-weight="300"
    fill="#ffffff" fill-opacity="0.35"
    text-anchor="middle" letter-spacing="9">REVENUE INTELLIGENCE</text>

  <!-- ── Dot divider ─────────────────────────────────────────────────── -->
  <circle cx="932" cy="836" r="3" fill="#16B6C9" fill-opacity="0.25"/>
  <circle cx="960" cy="836" r="3" fill="#16B6C9" fill-opacity="0.45"/>
  <circle cx="988" cy="836" r="3" fill="#16B6C9" fill-opacity="0.25"/>

  <!-- ── Corner branding marks ───────────────────────────────────────── -->
  <!-- Bottom-left -->
  <text x="48" y="1046"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="16" font-weight="300"
    fill="#ffffff" fill-opacity="0.12"
    letter-spacing="2.5">RevenueMD · Puerto Rico</text>

  <!-- Bottom-right -->
  <text x="1872" y="1046"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="16" font-weight="300"
    fill="#ffffff" fill-opacity="0.12"
    text-anchor="end" letter-spacing="2.5">Healthcare Billing Intelligence</text>
</svg>
