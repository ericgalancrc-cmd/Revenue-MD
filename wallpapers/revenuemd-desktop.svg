<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050E20"/>
      <stop offset="50%"  stop-color="#0D1C46"/>
      <stop offset="100%" stop-color="#071230"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="46%" r="22%">
      <stop offset="0%"   stop-color="#16B6C9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#16B6C9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>

    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#16B6C9" flood-opacity="0.40"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#16B6C9" flood-opacity="0.48"/>
    </filter>
  </defs>

  <!-- ── Backgrounds ─────────────────────────────────────────────────── -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- ── Large faint stethoscope watermark ─────────────────────────── -->
  <!-- 800×800, centered on canvas: (1920-800)/2=560, (1080-800)/2=140 -->
  <g transform="translate(560, 140)" opacity="0.045">
    <svg x="0" y="0" width="800" height="800" viewBox="0 0 24 24">
      <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"
        fill="none" stroke="#16B6C9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"
        fill="none" stroke="#16B6C9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="10" r="2"
        fill="none" stroke="#16B6C9" stroke-width="1.2"/>
    </svg>
  </g>

  <!-- ── Accent lines ────────────────────────────────────────────────── -->
  <line x1="0"    y1="130"  x2="1920" y2="130"  stroke="#16B6C9" stroke-width="1" opacity="0.05"/>
  <line x1="0"    y1="950"  x2="1920" y2="950"  stroke="#16B6C9" stroke-width="1" opacity="0.05"/>
  <line x1="180"  y1="0"    x2="180"  y2="1080" stroke="#16B6C9" stroke-width="1" opacity="0.04"/>
  <line x1="1740" y1="0"    x2="1740" y2="1080" stroke="#16B6C9" stroke-width="1" opacity="0.04"/>

  <!-- ── Icon mark — 240×240, centered at (960, 420) ───────────────── -->
  <circle cx="960" cy="420" r="155" fill="#16B6C9" fill-opacity="0.07"/>

  <!-- Icon starts at (960-120, 420-120) = (840, 300) -->
  <g transform="translate(840, 300)" filter="url(#iconGlow)">
    <rect width="240" height="240" rx="60"
      fill="#0F224E" stroke="#16B6C9" stroke-width="2" stroke-opacity="0.55"/>
    <!-- Stethoscope 190×190 with 25px padding -->
    <svg x="25" y="25" width="190" height="190" viewBox="0 0 24 24">
      <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"
        fill="none" stroke="#16B6C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"
        fill="none" stroke="#16B6C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="10" r="2"
        fill="none" stroke="#16B6C9" stroke-width="1.8"/>
    </svg>
  </g>

  <!-- ── Thin separator ──────────────────────────────────────────────── -->
  <line x1="770" y1="572" x2="1150" y2="572" stroke="#16B6C9" stroke-width="1" stroke-opacity="0.22"/>

  <!-- ── Wordmark ────────────────────────────────────────────────────── -->
  <text x="960" y="645"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="60" font-weight="400"
    fill="#ffffff" fill-opacity="0.90"
    text-anchor="middle" letter-spacing="3">Revenue</text>

  <text x="960" y="740"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96" font-weight="700"
    fill="#16B6C9" text-anchor="middle" letter-spacing="8"
    filter="url(#textGlow)">MD</text>

  <!-- ── Tagline ─────────────────────────────────────────────────────── -->
  <text x="960" y="792"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="21" font-weight="300"
    fill="#ffffff" fill-opacity="0.35"
    text-anchor="middle" letter-spacing="9">REVENUE INTELLIGENCE</text>

  <!-- ── Dot divider ─────────────────────────────────────────────────── -->
  <circle cx="932" cy="832" r="3" fill="#16B6C9" fill-opacity="0.25"/>
  <circle cx="960" cy="832" r="3" fill="#16B6C9" fill-opacity="0.45"/>
  <circle cx="988" cy="832" r="3" fill="#16B6C9" fill-opacity="0.25"/>

  <!-- ── Corner branding ─────────────────────────────────────────────── -->
  <text x="48" y="1048"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="16" font-weight="300"
    fill="#ffffff" fill-opacity="0.12" letter-spacing="2.5">RevenueMD · Puerto Rico</text>

  <text x="1872" y="1048"
    font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
    font-size="16" font-weight="300"
    fill="#ffffff" fill-opacity="0.12"
    text-anchor="end" letter-spacing="2.5">Healthcare Billing Intelligence</text>
</svg>
